name: Deploy QIE SafeRoute

# Requires Settings -> Pages -> Source = "GitHub Actions".
# `actions/deploy-pages` fails if the repository is still configured to deploy from the
# `gh-pages` branch, and the published site will then not be refreshed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate SDK and contract
        run: npm run lint && npm test && npm run contracts:test
      - name: Build app
        run: npm run build
        # Registry addresses must be present at build time or the deployed bundle will
        # permanently disable the on-chain controls. Set these as repository variables
        # (Settings -> Secrets and variables -> Actions -> Variables) after a deployment
        # has been verified in the explorer.
        env:
          VITE_QIE_TESTNET_REGISTRY_ADDRESS: ${{ vars.VITE_QIE_TESTNET_REGISTRY_ADDRESS }}
          VITE_QIE_MAINNET_REGISTRY_ADDRESS: ${{ vars.VITE_QIE_MAINNET_REGISTRY_ADDRESS }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
